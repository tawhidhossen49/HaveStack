<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in | HaveStack Portal</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="../assets/favicon.png" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0A0A0C" />
<link rel="stylesheet" href="../assets/console.css" />
<link rel="stylesheet" href="css/portal.css" />
</head>
<body>
<main class="login">
  <div class="login-card">
    <span class="login-eyebrow">Shareholder portal</span>
    <div class="login-brand">
      <img src="../assets/logo-mark-96.png" alt="" width="26" height="26" />
      <h1>HaveStack Portal</h1>
    </div>
    <p class="lead" id="lead">Checking your session.</p>
    <div id="slot"></div>
  </div>
</main>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="../assets/site-config.js"></script>
<script src="../assets/console-ui.js"></script>
<script src="js/vendor/supabase.js"></script>
<script src="js/portal-auth.js"></script>
<script src="js/portal-common.js"></script>
<script>
(function () {
  "use strict";
  var lead = document.getElementById("lead");
  var slot = document.getElementById("slot");
  var esc  = ConsoleUI.escapeHtml;
  var params = new URLSearchParams(location.search);

  if (!PortalAuth.configured()) { PortalAuth.showUnconfigured(); return; }

  var OFF = "Your portal access has been switched off. If you think that is a mistake, " +
            "contact your portal administrator.";

  function notice(msg, isError) {
    if (!msg) return "";
    return '<div class="notice" style="border-left-color:' +
      (isError ? "var(--red)" : "var(--line-3)") + '"><p>' + msg + "</p></div>";
  }

  /* Before the portal has an administrator nobody can sign in, so say how the
     first one is made rather than showing a form that cannot work. */
  function offerSetup() {
    PortalAuth.callFunction("setup-state", {}, { anonymous: true }).then(function (r) {
      var box = document.getElementById("setupHint");
      if (!box || !r || !r.setup_required) return;
      box.innerHTML = notice("The portal has no administrator yet. If you run the HaveStack " +
        'admin panel, <a href="setup.html">set up the portal</a> to create the first one.');
    });
  }

  /* ---- sign in ----------------------------------------------------------- */
  function signInView(msg, isError, email) {
    lead.textContent = "Sign in to the shareholder portal.";
    slot.innerHTML = notice(msg, isError) + '<div id="setupHint"></div>' +
      '<form id="f" novalidate>' +
        '<div class="field"><label for="email">Email</label>' +
          '<input id="email" type="email" autocomplete="username" ' +
            'placeholder="you@example.com" value="' + esc(email || "") + '" /></div>' +
        '<div class="field"><label for="pw">Portal password</label>' +
          '<input id="pw" type="password" autocomplete="current-password" /></div>' +
        '<button class="btn btn-key btn-block" type="submit" id="go">Sign in</button>' +
      "</form>" +
      '<p class="login-foot">Your portal password is separate from any admin panel password.<br />' +
      '<a href="#" id="forgot">Forgotten your password?</a></p>';

    document.getElementById("f").addEventListener("submit", function (e) {
      e.preventDefault();
      var em = document.getElementById("email").value.trim();
      var pw = document.getElementById("pw").value;
      if (!em || !pw) { signInView("Enter both your address and your portal password.", true, em); return; }

      var btn = document.getElementById("go");
      btn.disabled = true; btn.textContent = "Signing in";

      PortalAuth.signIn(em, pw).then(function (res) {
        if (res.error) {
          /* A switched off account is banned in Auth, which is the one refusal
             worth naming. Otherwise the same words whether the address has no
             account or the password is wrong: saying which tells a stranger
             whether an address is on the share register. */
          signInView(/banned/i.test(res.error.message || "") ? OFF
                     : "That address and portal password did not match an account.", true, em);
          return;
        }
        lead.textContent = "Checking your access.";
        return afterSession(res.data.session, em);
      }).catch(function (err) {
        signInView("Could not reach the server. " + esc(err.message || String(err)), true, em);
      });
    });

    document.getElementById("forgot").addEventListener("click", function (e) {
      e.preventDefault();
      forgotView(document.getElementById("email").value.trim());
    });
    offerSetup();
  }

  function forgotView(email) {
    lead.textContent = "Forgotten your password?";
    slot.innerHTML = notice("Portal passwords are set by your portal administrator, so ask them " +
      "for a new one. The portal does not send reset emails: an emailed link is the easiest " +
      "way into somebody else's account, and a share register should not have one.") +
      '<p class="login-foot"><a href="#" id="back">Back to sign in</a></p>';
    document.getElementById("back").addEventListener("click", function (e) {
      e.preventDefault(); signInView("", false, email);
    });
  }

  function logSignIn(m, detail) {
    return PortalAuth.client().from("portal_activity").insert({
      account_id: m.account.id,
      shareholder_id: m.holder ? m.holder.id : null,
      kind: "sign_in",
      detail: detail,
      device: PortalAuth.shortDevice()
    }).then(function () {}, function () {});
  }

  /* Signed in. Is this sign in a portal account, is it switched on, and is
     there a second factor still to satisfy? All three before the portal opens. */
  function afterSession(session, typed) {
    return PortalAuth.loadMember(session).then(function (m) {
      if (!m) {
        return PortalAuth.client().auth.signOut().then(function () {
          signInView("That sign in has no portal access.", true, typed);
        });
      }
      if (m.account.status !== "active" || (m.holder && m.holder.status !== "active")) {
        return PortalAuth.client().auth.signOut().then(function () {
          signInView(OFF, true, typed || m.account.email);
        });
      }
      return needsSecondFactor().then(function (factorId) {
        if (factorId) { challengeView(factorId, m); return; }
        return logSignIn(m, "Signed in").then(function () { location.replace("index.html"); });
      });
    });
  }

  function needsSecondFactor() {
    var c = PortalAuth.client();
    if (!c.auth.mfa || !c.auth.mfa.getAuthenticatorAssuranceLevel) return Promise.resolve(null);
    return c.auth.mfa.getAuthenticatorAssuranceLevel().then(function (r) {
      var d = r && r.data;
      if (!d || d.currentLevel === d.nextLevel) return null;
      return PortalAuth.listFactors().then(function (f) {
        var v = ((f && f.totp) || []).filter(function (x) { return x.status === "verified"; });
        return v.length ? v[0].id : null;
      });
    }).catch(function () { return null; });
  }

  function challengeView(factorId, m) {
    lead.textContent = "One more step.";
    slot.innerHTML =
      '<form id="mf" novalidate>' +
        '<div class="field"><label for="code">Six digit code</label>' +
          '<input id="code" inputmode="numeric" autocomplete="one-time-code" ' +
            'maxlength="6" placeholder="000000" />' +
          '<span class="hint">From the authenticator app on your phone.</span></div>' +
        '<button class="btn btn-key btn-block" type="submit" id="mgo">Verify</button>' +
      "</form>" +
      '<p class="login-foot"><a href="#" id="cancel">Cancel and sign out</a></p>';

    document.getElementById("mf").addEventListener("submit", function (e) {
      e.preventDefault();
      var code = document.getElementById("code").value.trim();
      if (!/^[0-9]{6}$/.test(code)) { ConsoleUI.toast("That should be six digits.", true); return; }
      var btn = document.getElementById("mgo");
      btn.disabled = true; btn.textContent = "Verifying";
      PortalAuth.verifyTotp(factorId, code).then(function (r) {
        if (r.error) {
          btn.disabled = false; btn.textContent = "Verify";
          ConsoleUI.toast("That code was not accepted. Try the next one.", true);
          return;
        }
        logSignIn(m, "Signed in with two factor").then(function () { location.replace("index.html"); });
      });
    });
    document.getElementById("cancel").addEventListener("click", function (e) {
      e.preventDefault();
      PortalAuth.client().auth.signOut().then(function () { signInView("", false); });
    });
  }

  /* ---- which view is this? ----------------------------------------------- */
  PortalAuth.client().auth.getSession().then(function (r) {
    var session = r.data && r.data.session;
    if (!session) {
      signInView(params.get("disabled") ? OFF
                 : params.get("denied") ? "That sign in has no portal access." : "",
                 !!(params.get("disabled") || params.get("denied")));
      return;
    }
    lead.textContent = "Checking your access.";
    return afterSession(session, "");
  }).catch(function (err) {
    signInView("Could not reach the server. " + esc(err.message || String(err)), true);
  });
})();
</script>
</body>
</html>
