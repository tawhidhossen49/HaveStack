<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in | HaveStack Admin</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="../assets/favicon.png" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0A0A0C" />
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>
<main class="login">
  <div class="login-card">
    <div class="login-brand">
      <img src="../assets/logo-mark-96.png" alt="" width="26" height="26" />
      <h1>HaveStack Admin</h1>
    </div>
    <p class="lead" id="lead">Checking your session.</p>
    <div id="slot"></div>
  </div>
</main>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="../assets/site-config.js"></script>
<script src="js/vendor/supabase.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-common.js"></script>
<script>
(function () {
  "use strict";
  var lead = document.getElementById("lead");
  var slot = document.getElementById("slot");
  var esc  = Admin.escapeHtml;

  if (!AdminAuth.configured()) { AdminAuth.showUnconfigured(); return; }

  function notice(msg, isError) {
    if (!msg) return "";
    return '<div class="notice" style="border-left-color:' +
      (isError ? "var(--red)" : "var(--line-3)") + '"><p>' + msg + "</p></div>";
  }

  /* ---- sign in ----------------------------------------------------------- */
  function signInView(msg, isError, email) {
    lead.textContent = "Sign in to manage the site.";
    slot.innerHTML = notice(msg, isError) +
      '<form id="f" novalidate>' +
        '<div class="field"><label for="email">Email</label>' +
          '<input id="email" type="email" autocomplete="username" ' +
            'placeholder="you@example.com" value="' + esc(email || "") + '" /></div>' +
        '<div class="field"><label for="pw">Password</label>' +
          '<input id="pw" type="password" autocomplete="current-password" /></div>' +
        '<button class="btn btn-key btn-block" type="submit" id="go">Sign in</button>' +
      "</form>" +
      '<p class="login-foot"><a href="#" id="forgot">Forgot your password?</a><br />' +
      "Accounts are created by whoever administers this site.</p>";

    document.getElementById("f").addEventListener("submit", function (e) {
      e.preventDefault();
      var em = document.getElementById("email").value.trim();
      var pw = document.getElementById("pw").value;
      if (!em || !pw) { signInView("Enter both your address and password.", true, em); return; }

      var btn = document.getElementById("go");
      btn.disabled = true; btn.textContent = "Signing in";

      AdminAuth.signIn(em, pw).then(function (res) {
        if (res.error) {
          /* Supabase returns the same message for a wrong password and for an
             address with no account. Repeat that rather than narrowing it:
             saying which one it was tells a stranger whether the address
             exists. */
          signInView("That address and password did not match an account.", true, em);
          return;
        }
        lead.textContent = "Checking your access.";
        return AdminAuth.lookupAdmin(res.data.session).then(function (row) {
          if (row) { location.replace("index.html"); return; }
          return AdminAuth.client().auth.signOut().then(function () {
            signInView("<strong>" + esc(em) + "</strong> signed in, but is not on the " +
              "admin list. Ask whoever administers this site to add it.", true, em);
          });
        });
      }).catch(function (err) {
        signInView("Could not reach the server. " + esc(err.message || String(err)), true, em);
      });
    });

    document.getElementById("forgot").addEventListener("click", function (e) {
      e.preventDefault();
      resetView(document.getElementById("email").value.trim());
    });
  }

  /* ---- ask for a reset link ---------------------------------------------- */
  function resetView(email) {
    lead.textContent = "Reset your password.";
    slot.innerHTML =
      '<form id="rf" novalidate>' +
        '<div class="field"><label for="remail">Email</label>' +
          '<input id="remail" type="email" autocomplete="username" value="' + esc(email || "") + '" />' +
          '<span class="hint">We will send a link that lets you set a new password.</span></div>' +
        '<button class="btn btn-key btn-block" type="submit" id="rgo">Send the link</button>' +
      "</form>" +
      '<p class="login-foot"><a href="#" id="back">Back to sign in</a></p>';

    document.getElementById("rf").addEventListener("submit", function (e) {
      e.preventDefault();
      var em = document.getElementById("remail").value.trim();
      if (!em) return;
      var btn = document.getElementById("rgo");
      btn.disabled = true; btn.textContent = "Sending";
      AdminAuth.sendReset(em).then(function () {
        lead.textContent = "Check your inbox.";
        /* Same wording whether or not that address has an account. */
        slot.innerHTML = notice("If <strong>" + esc(em) + "</strong> has an account, a " +
          "reset link is on its way. It opens this page and asks for a new password.") +
          '<p class="login-foot"><a href="login.html">Back to sign in</a></p>';
      }).catch(function (err) {
        btn.disabled = false; btn.textContent = "Send the link";
        Admin.toast(err.message || String(err), true);
      });
    });
    document.getElementById("back").addEventListener("click", function (e) {
      e.preventDefault(); signInView("", false, email);
    });
  }

  /* ---- arrived from a reset link ----------------------------------------- */
  function newPasswordView() {
    lead.textContent = "Set a new password.";
    slot.innerHTML =
      '<form id="pf" novalidate>' +
        '<div class="field"><label for="p1">New password</label>' +
          '<input id="p1" type="password" autocomplete="new-password" />' +
          '<span class="hint">At least eight characters.</span></div>' +
        '<div class="field"><label for="p2">Repeat it</label>' +
          '<input id="p2" type="password" autocomplete="new-password" /></div>' +
        '<button class="btn btn-key btn-block" type="submit" id="pgo">Save and sign in</button>' +
      "</form>";

    document.getElementById("pf").addEventListener("submit", function (e) {
      e.preventDefault();
      var a = document.getElementById("p1").value, b = document.getElementById("p2").value;
      if (a.length < 8) { Admin.toast("Use at least eight characters.", true); return; }
      if (a !== b)      { Admin.toast("Those two do not match.", true); return; }
      var btn = document.getElementById("pgo");
      btn.disabled = true; btn.textContent = "Saving";
      AdminAuth.updatePassword(a).then(function (res) {
        if (res.error) {
          btn.disabled = false; btn.textContent = "Save and sign in";
          Admin.toast(res.error.message, true); return;
        }
        location.replace("index.html");
      });
    });
  }

  /* ---- which of the three is this? --------------------------------------- */
  var denied = new URLSearchParams(location.search).get("denied");
  var recovery = /type=recovery/.test(location.hash || "");

  AdminAuth.client().auth.getSession().then(function (r) {
    var session = r.data && r.data.session;
    if (recovery && session) { newPasswordView(); return; }
    if (!session) {
      signInView(denied ? "That account is not on the admin list." : "", !!denied);
      return;
    }
    lead.textContent = "Checking your access.";
    return AdminAuth.lookupAdmin(session).then(function (row) {
      if (row) { location.replace("index.html"); return; }
      return AdminAuth.client().auth.signOut().then(function () {
        signInView("<strong>" + esc(session.user.email || "That account") +
          "</strong> is not on the admin list.", true, session.user.email || "");
      });
    });
  }).catch(function (err) {
    signInView("Could not reach the server. " + esc(err.message || String(err)), true);
  });
})();
</script>
</body>
</html>
